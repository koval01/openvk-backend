[package]
name = "openvk-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "High-performance OpenVK REST and WebSocket API"
license = "MIT"

[dependencies]
aes-gcm = "0.10.3"
argon2 = { version = "0.5.3", features = ["std"] }
axum = { version = "0.8.9", features = ["ws", "multipart"] }
base64 = "0.22.1"
bytes = "1.11.1"
chrono = { version = "0.4.45", features = ["serde"] }
hkdf = "0.12.4"
hmac = "0.12.1"
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", features = ["sink"] }
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
moka = { version = "0.12.16", features = ["future"] }
prost = "0.13.5"
rand = "0.9.2"
rsa = { version = "0.9.8", features = ["sha2"] }
redis = { version = "1.6.0", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "multipart"] }
sea-orm = { version = "2.0.2", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-json"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "compression-br", "compression-gzip", "trace", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.26.0", features = ["v7", "serde"] }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[build-dependencies]
prost-build = "0.13.5"

[dev-dependencies]
bytes = "1.11.1"
dotenvy = "0.15.7"
prost = "0.13.5"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "multipart"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
