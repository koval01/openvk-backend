# nginx on the Silo machine: the public read path for media.
#
# The API never serves object bytes. It signs S3 writes and deletes against
# Silo directly (port 9000) and hands browsers MEDIA_PUBLIC_BASE_URL/{key},
# which resolves here.
#
# Set MEDIA_PUBLIC_BASE_URL=https://media.example.org to match this server.

proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:64m
                 max_size=20g inactive=30d use_temp_path=off;

upstream silo {
    server 127.0.0.1:9000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name media.example.org;

    # Objects are immutable: a new upload gets a new UUID key.
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "*" always;

    # Uploads are signed by the API; nothing writes through this server.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location / {
        proxy_pass http://silo;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        proxy_cache media;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;

        # Silo's own XML errors are noise for a browser.
        proxy_intercept_errors on;
        error_page 403 404 = @missing;
    }

    location @missing {
        return 404;
    }
}
