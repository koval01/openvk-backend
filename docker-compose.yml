# Full stack: Envoy :80 → API, Nginx media (/media), Nginx SPA.
# Postgres/Redis stay on the host ports so `cargo run` can share them.
# The API is not published on 8080 — that port is for local cargo.

services:
  media-init:
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /var/openvk/media && chown -R 65534:65534 /var/openvk/media"]
    volumes:
      - media_data:/var/openvk/media

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgres://openvk:openvk@postgres:5432/openvk?sslmode=disable
      REDIS_URL: redis://redis:6379/
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-to-a-long-random-string}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1,http://localhost}
      STORAGE_BACKEND: disk
      MEDIA_ROOT: /var/openvk/media
      RUST_LOG: ${RUST_LOG:-openvk_backend=info,tower_http=info}
    volumes:
      - media_data:/var/openvk/media
    depends_on:
      media-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  media:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx-media.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/var/openvk/media:ro
    depends_on:
      media-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ../openvk-frontend
      dockerfile: Dockerfile
    restart: unless-stopped

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    ports:
      - "80:8080"
    volumes:
      - ./deploy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - api
      - media
      - web
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openvk
      POSTGRES_PASSWORD: openvk
      POSTGRES_DB: openvk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openvk -d openvk"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media_data:
