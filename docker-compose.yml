# The API is the only piece that ships as a container: stateless, read-only
# root filesystem, no volumes. Uploads go to the S3 bucket, Postgres and Redis
# live outside (managed cloud, or your own machines). The frontend is static
# and goes to a CDN, so it is not here.
#
# Local stack:  docker compose --profile dev up --build
#   postgres :5432   redis :6379   silo :9000 (console :9001)
# Production:   docker compose up -d api   with real env vars.
#
# There is no depends_on: the API exits when a dependency is missing and the
# restart policy brings it back, which is also how it behaves in the cloud.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgres://openvk:openvk@postgres:5432/openvk?sslmode=disable}
      REDIS_URL: ${COMPOSE_REDIS_URL:-redis://redis:6379/}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-to-a-long-random-string}
      DATA_KEY: ${DATA_KEY:-openvk-dev-data-key-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      STORAGE_BACKEND: s3
      S3_ENDPOINT: ${COMPOSE_S3_ENDPOINT:-http://silo:9000}
      S3_BUCKET: ${S3_BUCKET:-openvk}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-openvk}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-openvk-dev-secret}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-1}
      # Browsers read objects here. In dev the Vite server proxies /media to Silo.
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-/media}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}
      RUST_LOG: ${RUST_LOG:-openvk_backend=info,tower_http=info}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      silo:
        condition: service_healthy
        required: false
    restart: unless-stopped

  postgres:
    profiles: ["dev"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openvk
      POSTGRES_PASSWORD: openvk
      POSTGRES_DB: openvk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openvk -d openvk"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    profiles: ["dev"]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Stand-in for the Silo machine. In production Silo runs elsewhere with nginx
  # in front of it; here the bucket answers directly on :9000.
  silo:
    profiles: ["dev"]
    image: pgsty/silo:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-openvk}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-openvk-dev-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - silodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Creates the bucket and makes it world-readable, the same policy nginx
  # fronts in production. Runs once and exits.
  silo-init:
    profiles: ["dev"]
    image: pgsty/mc:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set silo http://silo:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done
        mc mb --ignore-existing silo/${S3_BUCKET:-openvk}
        mc anonymous set download silo/${S3_BUCKET:-openvk}
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-openvk}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-openvk-dev-secret}
    depends_on:
      silo:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata:
  redisdata:
  silodata:
